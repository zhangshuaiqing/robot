<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">GenBot 文档</title>
<meta name="description" content="GenBot 机器人项目文档">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">

<style>
:root {
  --bg: #0d1117;
  --card-bg: #161b22;
  --border: #30363d;
  --accent: #58a6ff;
  --accent-green: #3fb950;
  --text: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --content-width: 860px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
}

nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}
nav .inner {
  max-width: var(--content-width); margin: 0 auto;
  display: flex; align-items: center;
  height: 56px; gap: 24px;
}
nav .logo { font-weight: 700; font-size: 1.15rem; letter-spacing: -0.3px; }
nav .logo span { color: var(--accent); }
nav a { color: var(--text-secondary); text-decoration: none; font-size: 0.875rem; }
nav a:hover { color: var(--text); }

.content {
  max-width: var(--content-width);
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* Markdown 渲染样式 */
.content h1 {
  font-size: 2rem; font-weight: 800; margin: 0 0 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.content h2 {
  font-size: 1.5rem; font-weight: 700; margin: 36px 0 16px;
}
.content h3 {
  font-size: 1.15rem; font-weight: 600; margin: 24px 0 12px;
}
.content p {
  margin: 0 0 16px; color: var(--text-secondary);
}
.content a {
  color: var(--accent); text-decoration: none;
}
.content a:hover { text-decoration: underline; }
.content strong { color: var(--text); font-weight: 600; }

.content ul, .content ol {
  margin: 0 0 16px; padding-left: 24px;
  color: var(--text-secondary);
}
.content li { margin: 4px 0; }

.content code {
  font-family: var(--font-mono);
  background: rgba(255,255,255,0.06);
  padding: 2px 6px; border-radius: 4px;
  font-size: 0.85rem;
  color: var(--accent-green);
}
.content pre {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  overflow-x: auto;
  margin: 0 0 20px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  line-height: 1.6;
  color: var(--text);
}
.content pre code {
  background: none;
  padding: 0;
  color: inherit;
}

.content blockquote {
  border-left: 3px solid var(--accent);
  padding: 8px 16px;
  margin: 0 0 16px;
  background: rgba(88,166,255,0.04);
  border-radius: 0 8px 8px 0;
  color: var(--text-secondary);
}

.content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 20px;
}
.content th, .content td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}
.content th {
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  font-size: 0.75rem;
  letter-spacing: 0.5px;
}
.content tr:hover { background: rgba(255,255,255,0.02); }

.content img {
  max-width: 100%;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 32px 0;
}

/* 加载指示 */
#loading {
  text-align: center; padding: 80px 24px; color: var(--text-muted);
}
.spinner {
  width: 32px; height: 32px; margin: 0 auto 16px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 错误提示 */
#error {
  display: none;
  text-align: center; padding: 80px 24px;
}
#error .emoji { font-size: 3rem; margin-bottom: 12px; }
#error p { color: var(--text-muted); }

footer {
  border-top: 1px solid var(--border);
  padding: 24px; text-align: center;
  color: var(--text-muted); font-size: 0.85rem;
}
footer a { color: var(--text-secondary); text-decoration: none; }
</style>
</head>
<body>

<nav>
  <div class="inner">
    <div class="logo"><span>Gen</span>Bot</div>
    <a href="./">主页</a>
    <a href="https://github.com/zhangshuaiqing/robot" target="_blank">GitHub</a>
  </div>
</nav>

<div id="loading">
  <div class="spinner"></div>
  <span>加载文档...</span>
</div>

<div id="error">
  <div class="emoji">📄</div>
  <p>文档加载失败</p>
</div>

<div class="content" id="content"></div>

<footer>
  <p><a href="https://github.com/zhangshuaiqing/robot">zhangshuaiqing/robot</a> · MIT License</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
async function loadDoc() {
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file') || 'PLAN.md';

  // 更新标题
  document.getElementById('page-title').textContent = 'GenBot — ' + file.replace('.md', '');

  try {
    const resp = await fetch(file);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const md = await resp.text();
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;
    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').querySelector('p').textContent = '无法加载 ' + file;
    console.error(e);
  }
}

loadDoc();
</script>
</body>
</html>
