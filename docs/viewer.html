<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenBot 3D 模型查看器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d1117; color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  height: 100vh;
}
model-viewer {
  width: 100%; height: 100vh;
  --poster-color: transparent;
  --progress-bar-color: #58a6ff;
  --progress-ring-color: #30363d;
}
#info {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(13,17,23,0.8); backdrop-filter: blur(8px);
  padding: 8px 20px; border-radius: 8px;
  border: 1px solid #30363d;
  font-size: 0.85rem; color: #8b949e;
  pointer-events: none; z-index: 10;
}
#info strong { color: #58a6ff; }
#loading {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #8b949e; font-size: 1rem; z-index: 5;
  text-align: center; pointer-events: none;
}
#loading .spinner {
  width: 32px; height: 32px; margin: 0 auto 12px;
  border: 3px solid #30363d; border-top-color: #58a6ff;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#controls-hint {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(13,17,23,0.75); backdrop-filter: blur(8px);
  padding: 6px 16px; border-radius: 6px;
  border: 1px solid #30363d;
  font-size: 0.75rem; color: #484f58;
  pointer-events: none;
}
</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>加载 3D 模型...</span>
</div>

<div id="info">🤖 <strong>GenBot</strong> — 阿克曼转向底盘 · 拖拽旋转 / 滚轮缩放</div>
<div id="controls-hint">🖱 拖拽旋转 · 滚轮缩放 · 右键平移</div>

<model-viewer
  id="genbot-viewer"
  alt="GenBot 4轮阿克曼机器人"
  src="genbot.glb"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  camera-orbit="45deg 55deg 1.8m"
  min-camera-orbit="auto auto 0.5m"
  max-camera-orbit="auto auto 5m"
  shadow-intensity="0.5"
  exposure="1.2"
  tone-mapping="aces"
  auto-rotate
  rotation-per-second="3deg"
  interaction-prompt="none">
</model-viewer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const viewer = document.getElementById('genbot-viewer');
  viewer.addEventListener('load', () => {
    document.getElementById('loading').style.display = 'none';
  });
  viewer.addEventListener('error', (e) => {
    document.getElementById('loading').innerHTML = '模型加载失败，请刷新重试';
  });
});
</script>
</body>
</html>
